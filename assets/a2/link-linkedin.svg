<svg xmlns="http://www.w3.org/2000/svg" width="89" height="34" viewBox="0 0 89 34" role="img" aria-label="LinkedIn">
<style>:root{--bg:#07070F;--panel:#0D0B1A;--line:#2A2340;--accent:#FF9A3C;--gold:#FFD27A;--violet:#8466FF;--text:#C9D1D9;--muted:#8B949E;--bright:#F0F6FC;--hole:#000000;--horizon:#000000;--star:#FFFFFF}@font-face{font-family:'SG';src:url(data:font/woff2;base64,) format('woff2');}
.bg{fill:var(--bg)}.panel{fill:var(--panel)}.ln{stroke:var(--line)}.acc{fill:var(--accent)}.gold{fill:var(--gold)}
.vio{fill:var(--violet)}.txt{fill:var(--text)}.mut{fill:var(--muted)}.brt{fill:var(--bright)}
.sg{font-family:'SG',sans-serif;font-weight:600}.sgr{font-family:'SGR','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif}.jb{font-family:'JB',Consolas,monospace}
</style>
<rect x="0.5" y="0.5" width="88" height="33" rx="17" class="panel ln"/><text x="18" y="21.5" class="sg txt" font-size="13">LinkedIn</text>
