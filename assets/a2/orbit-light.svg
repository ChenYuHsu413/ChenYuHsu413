<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Decorative orbit map of project categories: Professional, AI &amp; ML, Web &amp; Data, Game Tools, Archive">
<style>:root{--bg:#FFFFFF;--panel:#F6F8FA;--line:#D0D7DE;--accent:#B54708;--gold:#7A4F00;--violet:#6639BA;--text:#1F2328;--muted:#59636E;--bright:#1F2328;--hole:#1F2328;--horizon:#EEEAF8;--star:#6639BA}@font-face{font-family:'JB';src:url(data:font/woff2;base64,) format('woff2');}
.bg{fill:var(--bg)}.panel{fill:var(--panel)}.ln{stroke:var(--line)}.acc{fill:var(--accent)}.gold{fill:var(--gold)}
.vio{fill:var(--violet)}.txt{fill:var(--text)}.mut{fill:var(--muted)}.brt{fill:var(--bright)}
.sg{font-family:'SG',sans-serif;font-weight:600}.sgr{font-family:'SGR','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif}.jb{font-family:'JB',Consolas,monospace}
</style>
<defs>
<radialGradient id="halo"><stop offset="0" style="stop-color:var(--violet);stop-opacity:0.5"/><stop offset="0.5" style="stop-color:var(--violet);stop-opacity:0.12"/><stop offset="1" style="stop-color:var(--violet);stop-opacity:0"/></radialGradient>
<linearGradient id="disk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent);stop-opacity:0.1"/><stop offset="0.5" style="stop-color:var(--gold);stop-opacity:1"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0.1"/></linearGradient>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="front"><rect x="-80" y="0" width="160" height="80"/></clipPath>
</defs>
<rect width="860" height="300" rx="14" class="bg"/>
<path id="o0" d="M300,150 a130,41.6 0 1,0 260,0 a130,41.6 0 1,0 -260,0" fill="none" class="ln" style="stroke:var(--line)" stroke-width="1.2"/><circle r="3.5" class="gold"><animateMotion dur="40s" begin="-0.0s" repeatCount="indefinite"><mpath href="#o0"/></animateMotion></circle><path id="o1" d="M240,150 a190,60.800000000000004 0 1,0 380,0 a190,60.800000000000004 0 1,0 -380,0" fill="none" class="ln" style="stroke:var(--line)" stroke-width="1.2"/><circle r="4" class="vio"><animateMotion dur="62s" begin="-8.1s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion></circle><path id="o2" d="M180,150 a250,80.0 0 1,0 500,0 a250,80.0 0 1,0 -500,0" fill="none" class="ln" style="stroke:var(--line)" stroke-width="1.2"/><circle r="3.5" class="gold"><animateMotion dur="84s" begin="-21.8s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></circle><circle r="3.5" class="gold"><animateMotion dur="84s" begin="-63.8s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></circle><path id="o3" d="M120,150 a310,99.2 0 1,0 620,0 a310,99.2 0 1,0 -620,0" fill="none" class="ln" style="stroke:var(--line)" stroke-width="1.2"/><circle r="4" class="vio"><animateMotion dur="106s" begin="-41.3s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion></circle><circle r="4" class="vio"><animateMotion dur="106s" begin="-94.3s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion></circle><path id="o4" d="M60,150 a370,118.4 0 1,0 740,0 a370,118.4 0 1,0 -740,0" fill="none" class="ln" style="stroke:var(--line)" stroke-width="1.2"/><circle r="3.5" class="gold"><animateMotion dur="128s" begin="-66.6s" repeatCount="indefinite"><mpath href="#o4"/></animateMotion></circle>
<g transform="translate(430 150)">
<circle r="90" fill="url(#halo)"/>
<g transform="scale(1 0.3)"><circle r="56" fill="none" stroke="url(#disk)" stroke-width="12" filter="url(#gl)">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle></g>
<circle r="26" fill="none" style="stroke:var(--gold)" stroke-width="2" opacity="0.8"/>
<circle r="24" style="fill:var(--hole)"/>
<g transform="scale(1 0.3)"><g clip-path="url(#front)"><circle r="56" fill="none" stroke="url(#disk)" stroke-width="7"/></g></g>
</g>
<rect x="379.6" y="98.4" width="100.8" height="20" rx="10" class="bg ln"/><text x="430.0" y="112.4" text-anchor="middle" class="jb txt" font-size="11.5">Professional</text><rect x="251.3" y="100.9" width="66.3" height="20" rx="10" class="bg ln"/><text x="284.5" y="114.9" text-anchor="middle" class="jb txt" font-size="11.5">AI &amp; ML</text><rect x="578.0" y="88.6" width="87.0" height="20" rx="10" class="bg ln"/><text x="621.5" y="102.6" text-anchor="middle" class="jb txt" font-size="11.5">Web &amp; Data</text><rect x="105.5" y="98.1" width="87.0" height="20" rx="10" class="bg ln"/><text x="149.0" y="112.1" text-anchor="middle" class="jb txt" font-size="11.5">Game Tools</text><rect x="732.2" y="90.0" width="66.3" height="20" rx="10" class="bg ln"/><text x="765.3" y="104.0" text-anchor="middle" class="jb txt" font-size="11.5">Archive</text>
</svg>
