<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="AIFinalProject — end-to-end predictive maintenance prototype (ML + MLOps loop, FastAPI + Next.js)">
<style>:root{--bg:#07070F;--panel:#0D0B1A;--line:#2A2340;--accent:#FF9A3C;--gold:#FFD27A;--violet:#8466FF;--text:#C9D1D9;--muted:#8B949E;--bright:#F0F6FC;--hole:#000000;--horizon:#000000;--star:#FFFFFF}@font-face{font-family:'SG';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'SGR';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JB';src:url(data:font/woff2;base64,) format('woff2');}
.bg{fill:var(--bg)}.panel{fill:var(--panel)}.ln{stroke:var(--line)}.acc{fill:var(--accent)}.gold{fill:var(--gold)}
.vio{fill:var(--violet)}.txt{fill:var(--text)}.mut{fill:var(--muted)}.brt{fill:var(--bright)}
.sg{font-family:'SG',sans-serif;font-weight:600}.sgr{font-family:'SGR','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif}.jb{font-family:'JB',Consolas,monospace}
</style>
<defs>
<radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" style="stop-color:var(--violet);stop-opacity:0.28"/><stop offset="1" style="stop-color:var(--violet);stop-opacity:0"/></radialGradient>
<linearGradient id="disk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent);stop-opacity:0.1"/><stop offset="0.5" style="stop-color:var(--gold);stop-opacity:1"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0.1"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="419" height="149" rx="14" class="panel ln"/>
<rect x="0.5" y="0.5" width="419" height="149" rx="14" fill="url(#glow)"/>
<g transform="translate(380 36)">
<g transform="rotate(-12) scale(1 0.3)"><circle r="22" fill="none" stroke="url(#disk)" stroke-width="4">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle></g>
<circle r="8" style="fill:var(--hole)"/><circle r="8" fill="none" style="stroke:var(--gold)" stroke-opacity="0.6"/>
</g>
<text x="22" y="44" class="sg gold" font-size="20">AIFinalProject</text>
<text x="22" y="78" class="sgr txt" font-size="13.5">end-to-end predictive maintenance prototype (ML +</text><text x="22" y="98" class="sgr txt" font-size="13.5">MLOps loop, FastAPI + Next.js)</text>
<circle cx="28" cy="125" r="5" style="fill:#3572A5"/><text x="40" y="129" class="jb mut" font-size="12">Python</text>
<rect x="337.9" y="115" width="62.1" height="20" rx="10" fill="none" style="stroke:var(--muted)" stroke-opacity="0.7"/><text x="346.9" y="129" class="jb mut" font-size="10.5" letter-spacing="0.8">ARCHIVE</text>
</svg>
