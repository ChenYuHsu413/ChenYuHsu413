<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="ECHOAi — Brand website for ECHOAi, SaySing's new AI product line (Next.js) — developed by me.">
<style>:root{--bg:#FFFFFF;--panel:#F6F8FA;--line:#D0D7DE;--accent:#B54708;--gold:#7A4F00;--violet:#6639BA;--text:#1F2328;--muted:#59636E;--bright:#1F2328;--hole:#1F2328;--horizon:#EEEAF8;--star:#6639BA}@font-face{font-family:'SG';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'SGR';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JB';src:url(data:font/woff2;base64,) format('woff2');}
.bg{fill:var(--bg)}.panel{fill:var(--panel)}.ln{stroke:var(--line)}.acc{fill:var(--accent)}.gold{fill:var(--gold)}
.vio{fill:var(--violet)}.txt{fill:var(--text)}.mut{fill:var(--muted)}.brt{fill:var(--bright)}
.sg{font-family:'SG',sans-serif;font-weight:600}.sgr{font-family:'SGR','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif}.jb{font-family:'JB',Consolas,monospace}
</style>
<defs>
<radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" style="stop-color:var(--violet);stop-opacity:0.28"/><stop offset="1" style="stop-color:var(--violet);stop-opacity:0"/></radialGradient>
<linearGradient id="disk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent);stop-opacity:0.1"/><stop offset="0.5" style="stop-color:var(--gold);stop-opacity:1"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0.1"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="419" height="149" rx="14" class="panel ln"/>
<rect x="0.5" y="0.5" width="419" height="149" rx="14" fill="url(#glow)"/>
<g transform="translate(380 36)">
<g transform="rotate(-12) scale(1 0.3)"><circle r="22" fill="none" stroke="url(#disk)" stroke-width="4">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle></g>
<circle r="8" style="fill:var(--hole)"/><circle r="8" fill="none" style="stroke:var(--gold)" stroke-opacity="0.6"/>
</g>
<text x="22" y="44" class="sg gold" font-size="20">ECHOAi</text>
<text x="22" y="78" class="sgr txt" font-size="13.5">Brand website for ECHOAi, SaySing's new AI product line</text><text x="22" y="98" class="sgr txt" font-size="13.5">(Next.js) — developed by me.</text>
<circle cx="28" cy="125" r="5" style="fill:var(--gold)"/><text x="40" y="129" class="jb mut" font-size="12">Next.js</text>
<rect x="342.8" y="115" width="57.2" height="20" rx="10" fill="none" style="stroke:var(--accent)" stroke-opacity="0.7"/><circle cx="353.8" cy="125" r="3" class="acc"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="365.8" y="129" class="jb acc" font-size="10.5" letter-spacing="0.8">LIVE</text>
</svg>
